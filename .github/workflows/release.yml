# Publishes to npm on a version tag (vX.Y.Z), built from the same tag of the
# Rust repository. Authenticates with npm trusted publishing (OIDC), so no
# token is stored; provenance is attached automatically.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    working-directory: orthoflow-js

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment in the npm trusted publisher settings.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: orthoflow-js
      - uses: actions/checkout@v5
        with:
          repository: nk-coding/orthoflow
          ref: ${{ github.ref_name }}
          path: orthoflow
      - name: Check versions match the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          js=$(node -p "require('./package.json').version")
          rust=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' ../orthoflow/Cargo.toml)
          echo "tag $tag, package.json $js, Cargo.toml $rust"
          [ "$tag" = "$js" ] && [ "$tag" = "$rust" ]
      - uses: ./orthoflow-js/.github/actions/setup
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish
