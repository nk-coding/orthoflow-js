name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The build and the tests use the Rust repository (the orthoflow submodule).
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
