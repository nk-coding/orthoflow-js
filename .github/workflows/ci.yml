name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: orthoflow-js

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: orthoflow-js
      # The build and the tests use the Rust repository next to this one.
      - uses: actions/checkout@v5
        with:
          repository: nk-coding/orthoflow
          path: orthoflow
      - uses: ./orthoflow-js/.github/actions/setup
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
